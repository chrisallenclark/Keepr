name: Build & Test

# GitHub's macOS runners are the Mac. Every push compiles the app and runs the
# test suite on a real iOS Simulator, so the project can be developed without
# owning a Mac.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Wire up the app icon
        run: ./scripts/prepare-app-icon.sh

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      best = (device["udid"], device["name"], runtime)
          if best:
              print(best[0])
              print(best[1], best[2], file=sys.stderr)
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iOS Simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Keepr.xcodeproj \
            -scheme Keepr \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Keepr.xcodeproj \
            -scheme Keepr \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      # Compiler diagnostics, pulled out of the noise so failures are readable
      # in the job summary without downloading anything.
      - name: Diagnostics
        if: always()
        run: |
          {
            echo '## Compiler diagnostics'
            echo '```'
            grep -hE "(error|warning): " build.log test.log 2>/dev/null | sort -u | head -100 || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Screenshots
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      BUNDLE_ID: com.chrisallenclark.Keepr

    steps:
      - uses: actions/checkout@v4

      - name: Wire up the app icon
        run: ./scripts/prepare-app-icon.sh

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      best = device["udid"]
          if best:
              print(best)
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iOS Simulator available on this runner."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Keepr.xcodeproj \
            -scheme Keepr \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Install the app
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name "Keepr.app" -type d | head -1)
          echo "Installing $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Capture every screen, light and dark
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p screenshots

          # A clean, consistent status bar — the same trick Apple's own
          # marketing shots use.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true

          capture() {
            local screen="$1" context="$2" appearance="$3"
            local name="${screen}-${context}-${appearance}"

            xcrun simctl ui "$UDID" appearance "$appearance" || true
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" \
              -KeeprDemoMode -KeeprScreen "$screen" -KeeprContext "$context" >/dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "screenshots/${name}.png"
            echo "captured ${name}"
          }

          for appearance in light dark; do
            capture today    business "$appearance"
            capture people   business "$appearance"
            capture profile  business "$appearance"
            capture followUp business "$appearance"
            capture search   business "$appearance"
            capture today    personal "$appearance"
          done

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
