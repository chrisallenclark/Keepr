name: TestFlight

# Archives a signed Release build and uploads it to TestFlight.
#
# Signing is handled entirely by an App Store Connect API key — xcodebuild's
# -allowProvisioningUpdates creates and downloads the certificate and profile
# itself. There is no .p12 to generate, no Keychain to unlock, and nothing that
# needs a Mac to set up. See docs/BUILDING_WITHOUT_A_MAC.md.
# Two ways in. `workflow_dispatch` only works once this file is on the default
# branch — that's a GitHub rule, and it's why pushing a tag is the reliable
# trigger while the app still lives on a feature branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this build (shown to testers)"
        required: false
        default: "Internal build."

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # A Team ID is not sensitive — it's embedded in every distributed build.
      # Defaulted so it isn't a fourth secret to set up; override it with the
      # APPLE_TEAM_ID secret if the account ever changes.
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'JC9MQST5S2' }}

    steps:
      - uses: actions/checkout@v4

      # Fail early and legibly rather than 20 minutes into a build.
      - name: Check prerequisites
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          missing=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::Missing repository secret $1 — see docs/BUILDING_WITHOUT_A_MAC.md"
              missing=1
            fi
          }
          require APP_STORE_CONNECT_KEY_ID "$KEY_ID"
          require APP_STORE_CONNECT_ISSUER_ID "$ISSUER_ID"
          require APP_STORE_CONNECT_PRIVATE_KEY "$PRIVATE_KEY"
          require APPLE_TEAM_ID "$TEAM_ID"

          echo "Signing as team $TEAM_ID"

          ICON="Keepr/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::error::$ICON is missing. App Store Connect rejects builds without a 1024x1024 marketing icon."
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1

      - name: Wire up the app icon
        run: ./scripts/prepare-app-icon.sh

      # Rebuilds the PEM from whatever ended up in the secret. A .p8 copied on
      # Windows arrives with CRLF line endings, which CryptoKit rejects outright
      # ("invalidPEMDocument"), and it's easy to paste the base64 body without
      # its BEGIN/END armour. Both are recoverable, so recover rather than making
      # someone re-paste and guess.
      - name: Install the App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ["PRIVATE_KEY"]
          had_armour = "BEGIN PRIVATE KEY" in raw

          # Strip the armour if present, then every scrap of whitespace, leaving
          # just the base64 body.
          body = re.sub(r"-----[^-]+-----", "", raw)
          body = re.sub(r"\s+", "", body)

          if not body:
              sys.exit("::error::APP_STORE_CONNECT_PRIVATE_KEY is empty once whitespace is stripped.")

          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              sys.exit(
                  "::error::APP_STORE_CONNECT_PRIVATE_KEY isn't valid base64. Re-copy the whole "
                  ".p8 file in a plain-text editor — Word and Notepad can mangle it."
              )

          # A PKCS#8 EC private key from Apple is ~200 bytes; anything tiny is a
          # truncated paste rather than a key.
          if len(der) < 64:
              sys.exit(f"::error::Decoded key is only {len(der)} bytes — the paste looks truncated.")

          wrapped = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          pem = f"-----BEGIN PRIVATE KEY-----\n{wrapped}\n-----END PRIVATE KEY-----\n"

          with open(os.environ["KEY_PATH"], "w", newline="\n") as file:
              file.write(pem)

          print(f"Key normalized: {len(der)} bytes DER, armour in secret: {had_armour}")
          PY

          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Keepr.xcodeproj \
            -scheme Keepr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Keepr.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tail -40

      - name: Export the IPA
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Keepr.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tail -40

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find build/export -name "*.ipa" | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Summary
        if: success()
        run: |
          {
            echo "## Uploaded to TestFlight"
            echo ""
            echo "Build **${{ github.run_number }}** is processing. It usually takes"
            echo "5–15 minutes before it appears in the TestFlight app."
            echo ""
            echo "> ${{ inputs.notes || 'Build from tag ' }}${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7
