name: Android

# Builds the Android app on GitHub's Linux runners — no Android Studio needed.
# Only runs when Android files change, so iOS work never triggers it.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read-only, to fetch the iOS screenshots the comparison is judged against.
  actions: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build, unit test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also verifies gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: keepr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  emulator:
    name: Emulator (${{ matrix.device }}, API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported Android on a small 360dp-wide phone.
          - device: small
            api-level: 26
            target: default
            profile: Nexus 5
          # A current Android on a typical 412dp-wide phone.
          - device: pixel6
            api-level: 35
            target: google_apis
            profile: pixel_6

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests and capture screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./scripts/emulator-smoke.sh build/emulator-screenshots ${{ matrix.device }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshots-${{ matrix.device }}
          path: android/build/emulator-screenshots/
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-test-reports-${{ matrix.device }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  compare:
    name: Compare with iOS
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      # Only to store the comparison bundle as a git blob (see below). No
      # branch, tag or commit is created.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Download Android screenshots
        uses: actions/download-artifact@v6
        with:
          pattern: emulator-screenshots-*
          path: android/build/compare/android
          merge-multiple: true

      - name: Download the latest iOS screenshots
        run: |
          set -euo pipefail
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios.yml --status success \
            --limit 20 --json databaseId --jq '.[].databaseId' | head -1)
          echo "Using iOS run $RUN"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n screenshots -D build/compare/ios
          ls build/compare/ios

      - name: Build side-by-side comparisons
        run: |
          pip install --quiet pillow
          python3 scripts/compare_screenshots.py build/compare/ios build/compare/android \
            build/compare/out

      # Reviewers working from a sandbox can reach api.github.com but not the
      # artifact storage, so the same images are also stored as one git blob.
      # A blob with nothing pointing at it changes no branch, tag or history;
      # it's fetched by hash from /git/blobs/<sha> and eventually collected.
      - name: Publish comparison bundle for API access
        run: |
          set -euo pipefail
          tar czf build/compare/bundle.tgz -C build/compare out ios android
          python3 -c 'import base64, json, sys; json.dump({"content": base64.b64encode(open(sys.argv[1], "rb").read()).decode(), "encoding": "base64"}, open(sys.argv[2], "w"))' \
            build/compare/bundle.tgz build/compare/blob.json
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input build/compare/blob.json --jq .sha)
          echo "COMPARISON_BLOB=$SHA"
          echo "Comparison bundle blob: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparisons
        uses: actions/upload-artifact@v6
        with:
          name: ios-android-comparison
          path: android/build/compare/out/
          if-no-files-found: warn
